#:schema https://dystroy.org/bacon/.bacon.schema.json

default_job = "run"
env.CARGO_TERM_COLOR = "always"

[jobs.run]
command = [
    "sh",
    "-c",
    "bunx @tailwindcss/cli -i static/input.css -o static/output.css && cargo run",
]
need_stdout = true
allow_warnings = true
background = true
watch = ["templates", "static/input.css", "static/search.js"]
grace_period = "500ms"
