{% extends "base.html" %} {% block content %}
<article class="h-full prose max-w-full mx-auto w-full p-14 prose-p:my-4 prose-headings:my-4 overflow-y-auto">{{ content | spaceless | safe }}</article>

{% endblock content %} {% block nav_links %}
 {% for link in links | sort %}
  <li>
    <a href="{{ link | replace(from=".md", to=".html" ) }}" class="text-white"> {{ link | replace(from=".md", to="") |
      split(pat="/") | last }} </a>
  </li>
  {% endfor %}
{% endblock nav_links %}
