{% extends "base.html" %} {% block content %}
<article class="h-full p-4 prose">{{ content | spaceless | safe }}</article>

{% endblock content %} {% block nav_links %}

 {% for link in links %}

  {% endfor %}
</ul>
{% endblock nav_links %}
