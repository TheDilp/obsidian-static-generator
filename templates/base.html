<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/{{output_dir}}/output.css" rel="stylesheet" />
    {% if title %}
    <title>{{ title }} - Wiki</title>
    {% else %}
    <title>Wiki</title>
    {% endif %} {% block head %}{% endblock head %}
  </head>

  <body class="bg-ink prose-p:text-white flex h-dvh w-dvw flex-col overflow-hidden">
    <header
      class="flex shrink-0 items-center justify-between border-b border-hairline-strong bg-panel px-6 py-4 shadow-[0_1px_0_0_rgba(0,0,0,0.5)] sm:px-10"
    >
      <a
        href="/{{output_dir}}/index.html"
        class="font-serif text-xl italic text-parchment transition-colors hover:text-gold"
        >Wiki</a
      >

      <div class="hidden min-w-0 max-w-sm flex-1 px-6 sm:block">
        <label class="group relative block">
          <span class="sr-only">Search pages</span>
          <svg
            aria-hidden="true"
            viewBox="0 0 16 16"
            fill="none"
            class="pointer-events-none absolute left-3 top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-lexicon-dim transition-colors group-focus-within:text-gold"
          >
            <circle cx="6.5" cy="6.5" r="4.75" stroke="currentColor" stroke-width="1.25" />
            <path d="M10.1 10.1L14 14" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" />
          </svg>
          <input
            type="search"
            name="q"
            placeholder="Search pages&hellip;"
            autocomplete="off"
            class="w-full rounded-full border border-hairline-strong bg-ink/60 py-1.5 pl-9 pr-3 font-mono text-xs text-lexicon placeholder:text-lexicon-dim transition-colors [&::-webkit-search-cancel-button]:hidden focus:border-gold focus:bg-ink focus:outline-none"
          />
        </label>
      </div>

      <nav aria-label="Primary" class="flex shrink-0 items-center gap-x-7">
        <a
          href="/{{output_dir}}/index.html"
          class="font-mono text-xs uppercase tracking-[0.2em] transition-colors {% if section == 'pages' %}text-gold{% else %}text-lexicon-dim hover:text-gold{% endif %}"
          >Pages</a
        >
        <a
          href="/{{output_dir}}/tags/index.html"
          class="font-mono text-xs uppercase tracking-[0.2em] transition-colors {% if section == 'tags' %}text-gold{% else %}text-lexicon-dim hover:text-gold{% endif %}"
          >Tags</a
        >
      </nav>
    </header>
    <main class="flex min-h-0 flex-1 flex-col">
      {% block content %}{% endblock content %}
    </main>
  </body>
</html>
