<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/dist/css/output.css" rel="stylesheet" />
    {% if title %}
    <title>{{ title }} - Wiki</title>
    {% else %}
    <title>Wiki</title>
    {% endif %}
  </head>

  <body class="bg-zinc-900 prose-p:text-white h-dvh flex flex-nowrap w-dvw">
    <section class="bg-zinc-950 lg:w-72 p-4">
      <h2 class="text-lg font-bold border-b border-white mb-4">
        <a href="/dist/index.html" class="w-full">Home - Wiki</a>
      </h2>
      <ul class="text-sm flex flex-col gap-y-1">
        {% block nav_links %} {% endblock nav_links %}
      </ul>
    </section>
    <main class="flex-1 flex flex-col">
      {% block content %}{% endblock content %}
    </main>
  </body>
</html>
