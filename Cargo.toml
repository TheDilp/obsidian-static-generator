[package]
name = "obsidian-publisher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
gray_matter = "0.3.2"
pulldown-cmark = { version = "0.13.4", features = ["serde"] }
rayon = "1.12.0"
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tera = { version = "2.4.0", features = ["glob_fs"] }
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unidecode = "0.3.0"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
